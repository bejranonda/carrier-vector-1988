<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the canvas reach under a notch; the safe-area
         probe below tells the layout solver where the usable screen actually
         is. Zoom is disabled because a pinch during a dogfight is not a
         gesture anyone intended. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Carrier Vector: 1988 — Retro CRT Vector Flight Simulator &amp; Carrier Deck Strategy Game</title>

    <meta name="description" content="Carrier Vector: 1988 is a browser-based retro vector flight simulator combining 6-DOF aerodynamics, terrain-masking radar evasion and aircraft carrier deck logistics. Pure TypeScript, zero 3D engines, 1980s CRT phosphor wireframe graphics." />
    <meta name="keywords" content="vector flight simulator, retro game, CRT phosphor, wireframe 3D, TypeScript game, HTML5 canvas game, carrier deck management, 6-DOF flight dynamics, radar terrain masking, browser game, 1980s arcade, no game engine, linear algebra 3D, air combat simulator" />
    <meta name="author" content="bejranonda" />
    <meta name="theme-color" content="#070d11" />
    <link rel="canonical" href="https://bejranonda.github.io/carrier-vector-1988/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Carrier Vector: 1988 — Retro CRT Vector Flight Simulator" />
    <meta property="og:description" content="A dual-loop browser game: manage an aircraft carrier flight deck, then fly 6-DOF wireframe sorties through canyons to break SAM radar locks. Zero 3D engine dependencies." />
    <meta property="og:site_name" content="Carrier Vector: 1988" />
    <meta property="og:url" content="https://bejranonda.github.io/carrier-vector-1988/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Carrier Vector: 1988 — Retro CRT Vector Flight Simulator" />
    <meta name="twitter:description" content="Dual-loop retro flight sim: carrier deck logistics + 3D wireframe air combat. Pure TypeScript, no 3D engines." />

    <!-- Structured data: helps search engines and AI agents classify the project -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Carrier Vector: 1988",
      "description": "A retro 1980s-style vector graphics flight simulator and carrier deck logistics strategy game. Features fixed-timestep 6-DOF flight dynamics, procedural canyon terrain, radar line-of-sight terrain masking, RWR threat warnings, and CRT phosphor persistence rendering. Built in TypeScript with zero external 3D engine dependencies.",
      "genre": ["Flight Simulator", "Strategy", "Action", "Retro"],
      "gamePlatform": "Web Browser",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "author": { "@type": "Person", "name": "bejranonda" },
      "programmingLanguage": "TypeScript",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div class="screen">
      <canvas
        id="gameCanvas"
        tabindex="0"
        role="application"
        aria-label="Carrier Vector 1988 — vector flight simulator. Press H for the full control reference, or tap the menu button on a touchscreen."
      ></canvas>
      <!-- Zero-size probe whose padding resolves the safe-area insets, which
           JavaScript cannot read from env() any other way. -->
      <div id="safe-area-probe" aria-hidden="true"></div>

      <!-- Menu screens only: a way to tell us what happened, pre-filled with
           the build and the browser. Hidden in flight. -->
      <a id="feedback-link" class="shell-link" target="_blank" rel="noopener" hidden>FEEDBACK</a>

      <!-- In flight or on the deck only (the opposite of the feedback link
           above, so the two never fight for the same corner): a real,
           clickable way to pause and see what to do. A beginner playtest
           said plainly "I should have menu to click and select what to do" -
           this is that button. Hidden on touch, which has its own MENU
           control drawn on the canvas. -->
      <button id="menu-button" class="shell-link" type="button" hidden>MENU (ESC)</button>

      <!-- Shown only if the frame loop stops for good (GameLoop.onFatalError).
           A frozen canvas with no message is the worst way to lose a player. -->
      <div id="crash" class="crash" role="alertdialog" aria-labelledby="crash-title" hidden>
        <div class="crash-panel">
          <h2 id="crash-title">DISPLAY LOST SIGNAL</h2>
          <p>Something went wrong and the game stopped. Your missions, scores and settings are saved.</p>
          <div class="crash-actions">
            <button id="crash-reload" type="button">RELOAD</button>
            <a id="crash-report" target="_blank" rel="noopener">REPORT THIS</a>
          </div>
          <pre id="crash-detail"></pre>
        </div>
      </div>
    </div>

    <!-- Crawler/agent-readable summary. Hidden visually; the game itself is canvas-rendered. -->
    <noscript>
      <h1>Carrier Vector: 1988</h1>
      <p>
        A retro CRT vector flight simulator and aircraft carrier deck management game
        that runs entirely in the browser. This game requires JavaScript.
      </p>
      <p>
        Features: fixed-timestep 6-DOF flight dynamics with stall and G-load induced drag,
        procedural canyon terrain, radar line-of-sight terrain masking, radar cross-section
        modelling, RWR threat warnings, carrier catapult launch and arrested recovery,
        deck crew scheduling, and procedurally escalating enemy strike waves.
      </p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
